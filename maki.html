<!DOCTYPE html>
<html lang="ja">

    <style>

        body {
            font-family: 'Kiwi Maru', serif;
            background-color: #fdf2f8;
            color: #4a4a4a;
        }

            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 192, 203, 0.5);
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.2);
        }

        .btn-choice {
            transition: all 0.2s ease;
        }
        
        .btn-choice:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.3);
        }
        
        .btn-choice:active {
            transform: translateY(0);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #game-screen, #result-screen {
            display: none;
        }

        /* キャラクターアイコン（CSSで簡易作成） */
        .maki-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa 0%, #c084fc 100%);
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;

                width: 80px;
                height: 80px;
                font-size: 24px;
            }

            },
            {

function startGame() {
            // 設定取得
            player.looks = document.getElementById('sel-looks').value;
            player.personality = document.getElementById('sel-personality').value;
            player.aura = document.getElementById('sel-aura').value;
            player.relation = document.querySelector('input[name="relation"]:checked').value;

            // ▼▼▼ BGM再生処理を追記 ▼▼▼
            const selectedBgmKey = document.getElementById('sel-bgm').value;
            const bgm = document.getElementById('bgm');
            
            // 以前の曲が鳴っていれば一度止める
            bgm.pause();
            
            if (selectedBgmKey !== "none") {
                bgm.src = BGM_PATHS[selectedBgmKey]; // 選んだ曲のパスをセット
                bgm.volume = 0.2; // 音量（0.0 〜 1.0）
                bgm.play().catch(error => {
                    console.log("ブラウザの制限等でBGMが再生できませんでした", error);
                });
            }
            // ▲▲▲ ここまで追記 ▲▲▲

            // 画面切り替え
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('game-screen').classList.add('fade-in');

            currentEventIdx = 0;
            affection = 0;
            renderEvent();
        }

        function renderEvent() {
            const ev = events[currentEventIdx];
            
            // スクロールを上部に戻す
            document.getElementById('game-screen').scrollTo({ top: 0, behavior: 'smooth' });

            // UIリセット
            document.getElementById('ui-day').innerText = currentEventIdx + 1;
            document.getElementById('ui-event-title').innerText = ev.title;
            document.getElementById('ui-text').innerText = ev.text;
            document.getElementById('ui-speaker').classList.add('hidden');
            document.getElementById('ui-next-btn').classList.add('hidden');
            document.getElementById('ui-maki-status').style.opacity = 0;
            document.getElementById('ui-maki-img').src = MAKI_FACES.default; // 新しいイベント時はデフォルト顔に戻す
            
            const choicesContainer = document.getElementById('ui-choices');
            choicesContainer.innerHTML = '';
            choicesContainer.classList.remove('hidden');

            ev.choices.forEach((choice, idx) => {
                const btn = document.createElement('button');
                btn.className = "btn-choice w-full text-left bg-white border-2 border-pink-200 text-pink-600 font-bold py-3.5 px-4 sm:px-5 rounded-xl hover:bg-pink-50 text-sm sm:text-base leading-snug shadow-sm active:scale-[0.98]";
                btn.innerText = choice.text;
                btn.onclick = () => selectChoice(choice);
                choicesContainer.appendChild(btn);
            });
        }

        function selectChoice(choice) {
            // 基本リアクション取得
            const reactionText = choice.reactions[player.relation];
            
            let scoreChange = 0;
            let bonusMsg = "";
            let statusColor = "text-gray-500";
            let faceImg = MAKI_FACES.default; // 表情画像の初期値
            
            // ギャップ＆相性判定 (クリティカル・マイナス反転ロジック)
            switch(choice.tag) {
                case 'straight': // 王道
                    scoreChange = 5;
                    bonusMsg = "牧は好印象を抱いたようだ。（+5）";
                    statusColor = "text-pink-500";
                    faceImg = MAKI_FACES.smile;
                    break;
                case 'passive': // 控えめ
                    if (player.personality === 'mother' || player.aura === 'warm') {
                        scoreChange = 10;
                        bonusMsg = "【実家のような安心感】牧の心が安らいでいる…！（+10）";
                        statusColor = "text-yellow-500";
                        faceImg = MAKI_FACES.smile;
                    } else {
                        scoreChange = 2;
                        bonusMsg = "牧は少し物足りなさを感じているようだ。（+2）";
                        statusColor = "text-blue-400";
                        faceImg = MAKI_FACES.default;
                    }
                    break;
                case 'eccentric': // カオス
                    if (player.aura === 'chaos' || player.personality === 'high_tension') {
                        scoreChange = 12;
                        bonusMsg = "【笑いのツボ直撃】謎の行動が牧にクリティカルヒット！（+12）";
                        statusColor = "text-yellow-500";
                        faceImg = MAKI_FACES.surprise; // 予期せぬ行動にドギマギ
                    } else {
                        scoreChange = -5;
                        bonusMsg = "牧はあなたの奇行にドン引きしている…（-5）";
                        statusColor = "text-blue-600";
                        // 元の eww を disgust に変更
                        faceImg = MAKI_FACES.disgust; // ドン引き
                    }
                    break;
                case 'aggressive': // 強引
                    if (player.looks === 'beauty' || player.personality === 'devil') {
                        scoreChange = 12;
                        bonusMsg = "【小悪魔の魅力】強引な態度に牧はドキドキしている！（+12）";
                        statusColor = "text-red-500";
                        faceImg = MAKI_FACES.surprise; // ドキッとしている
                    } else {
                        scoreChange = -3;
                        bonusMsg = "急な距離の詰め方に、牧は少し警戒している。（-3）";
                        statusColor = "text-blue-600";
                        faceImg = MAKI_FACES.angry; // 警戒・反発
                    }
                    break;
                case 'cold': // 塩対応
                    if (player.personality === 'tsundere' || (player.looks === 'sharp' && player.personality === 'cool')) {
                        scoreChange = 15;
                        bonusMsg = "【ご褒美】冷たい態度が逆に牧の性癖にぶっ刺さった！！（+15）";
                        statusColor = "text-purple-500";
                        faceImg = MAKI_FACES.smile; // ゾクゾクして喜んでいる
                    } else {
                        scoreChange = -8;
                        bonusMsg = "冷たい態度に、牧は少し傷ついたようだ…（-8）";
                        statusColor = "text-blue-600";
                        faceImg = MAKI_FACES.sad; // しょんぼり
                    }
                    break;
            }

            affection += scoreChange;
            if(affection < 0) affection = 0; // マイナスにはならないようにする
            if(affection > 150) affection = 150; // MAX
            
            // メーター更新
            const meterPercent = Math.min((affection / 150) * 100, 100);
            document.getElementById('ui-affection').style.width = meterPercent + '%';
            
            // 下がった場合はメーターの色を一時的に青っぽくする演出
            const meterEl = document.getElementById('ui-affection');
            if (scoreChange < 0) {
                meterEl.classList.remove('bg-pink-400');
                meterEl.classList.add('bg-blue-400');
                setTimeout(() => {
                    meterEl.classList.remove('bg-blue-400');
                    meterEl.classList.add('bg-pink-400');
                }, 800);
            }

            // UI更新
            document.getElementById('ui-choices').classList.add('hidden');
            document.getElementById('ui-text').innerText = reactionText;
            document.getElementById('ui-speaker').classList.remove('hidden');
            
            // 表情画像の適用
            document.getElementById('ui-maki-img').src = faceImg;
            
            const statusEl = document.getElementById('ui-maki-status');
            statusEl.innerText = bonusMsg;
            statusEl.className = `h-6 text-xs sm:text-sm font-bold transition-opacity mt-1 ${statusColor}`;
            statusEl.style.opacity = 1;

            document.getElementById('ui-next-btn').classList.remove('hidden');

            // スマホでの視認性向上のため少し下にスクロールして次へボタンを見せる
            setTimeout(() => {
                const gameScreen = document.getElementById('game-screen');
                gameScreen.scrollTo({ top: gameScreen.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function nextEvent() {
            currentEventIdx++;
            if (currentEventIdx < events.length) {
                renderEvent();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('result-screen').classList.add('fade-in');

            document.getElementById('res-score').innerText = affection;

            let title = "";
            let desc = "";

            if (affection >= 130) {
                title = "【完全攻略】牧の心はあなたのもの！";
                desc = "あなたの容姿と立ち振る舞いが完璧に牧に刺さりました。もう牧はあなたなしでは生きていけません。完全敗北宣言です！";
                document.getElementById('res-score').classList.add('text-red-500');
            } else if (affection >= 100) {
                title = "【ハッピーエンド】甘い恋の始まり";
                desc = "王道の展開で見事に牧を落としました。関係性もバッチリ！これから二人の甘い日々が始まります。";
            } else if (affection >= 70) {
                title = "【ノーマルエンド】気になる存在";
                desc = "牧にとってあなたは「気になる特別な人」になりました。あと一歩で恋人同士！もう少しギャップを見せると良かったかも？";
            } else {
                title = "【友達エンド】いい同僚・先輩・後輩";
                desc = "牧の心の壁は完全には壊せませんでした。でも、人としてはとても信頼されています！容姿を変えてリベンジしてみましょう！";
            }

            document.getElementById('res-title').innerText = title;
            document.getElementById('res-desc').innerText = desc;
        }

        // 初期の画像を設定
        document.getElementById('ui-maki-img').src = MAKI_FACES.default;
    </script>
</body>
